<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bolhas BR</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Bolhas BR</h1>
    <p class="tagline">Desempenho de criptomoedas brasileiras e as 20 maiores ações da B3</p>
  </header>

  <nav class="tabs" role="tablist">
    <button id="tab-coins" role="tab" aria-controls="panel-coins" aria-selected="true">Criptomoedas</button>
    <button id="tab-stocks" role="tab" aria-controls="panel-stocks" aria-selected="false">20 Ações B3</button>
  </nav>

  <main>
    <section id="panel-coins" role="tabpanel">
      <div class="controls">
        <label>Tamanho das bolhas: <select id="size-mode"><option value="market_cap">Valor de mercado</option><option value="change">Variação (absoluta)</option></select></label>
        <button id="refresh-coins">Atualizar</button>
      </div>
      <div id="coins-container" class="bubbles-grid" aria-live="polite">Carregando...</div>
    </section>

    <section id="panel-stocks" role="tabpanel" hidden>
      <div class="controls">
        <button id="refresh-stocks">Atualizar</button>
      </div>
      <div id="stocks-container">Carregando...</div>
    </section>
  </main>

  <footer>
    <small>Serviço: <a href="/healthz">/healthz</a> · APIs: <a href="/api/coins">/api/coins</a> · <a href="/api/stocks">/api/stocks</a></small>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
