<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bolhas BR</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Bolhas BR</h1>
      <p>Criptomoedas brasileiras e ações da B3</p>
    </header>

    <nav class="tabs" role="tablist" aria-label="Seções do painel">
      <button id="tab-coins" class="tab active" role="tab" aria-selected="true" aria-controls="panel-coins">Criptomoedas</button>
      <button id="tab-stocks" class="tab" role="tab" aria-selected="false" aria-controls="panel-stocks">20 Ações B3</button>
    </nav>

    <main class="content">
      <section id="panel-coins" role="tabpanel" aria-label="Criptomoedas">
        <div class="toolbar">
          <label for="size-mode">Tamanho:</label>
          <select id="size-mode">
            <option value="market_cap">Valor de mercado</option>
            <option value="change">Variação</option>
          </select>
          <button id="refresh-coins" type="button">Atualizar</button>
        </div>
        <div id="coins-container" class="bubble-panel" aria-live="polite">Carregando...</div>
      </section>

      <section id="panel-stocks" role="tabpanel" aria-label="Ações" hidden>
        <div class="toolbar">
          <button id="refresh-stocks" type="button">Atualizar</button>
        </div>
        <div id="stocks-container" class="table-wrap">Carregando...</div>
      </section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
